name: Build binaries

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            binary: pixelate
          - name: linux-arm64
            os: ubuntu-24.04-arm
            binary: pixelate
          - name: windows-amd64
            os: windows-latest
            binary: pixelate.exe
          - name: macos-silicon
            os: macos-14
            binary: pixelate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Check for memory errors and leaks
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-sanitize
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            ./build-sanitize/pixelate --version
      - name: Stage binary
        shell: bash
        run: |
          mkdir package
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/Release/pixelate.exe package/pixelate.exe
          else
            cp build/pixelate package/pixelate
            chmod +x package/pixelate
          fi
      - name: Create zip
        working-directory: package
        run: cmake -E tar cf ../pixelate-${{ matrix.name }}.zip --format=zip ${{ matrix.binary }}
      - uses: actions/upload-artifact@v7
        with:
          name: pixelate-${{ matrix.name }}
          path: pixelate-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: pixelate-*
          path: release-assets
          merge-multiple: true
      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --repo "$RELEASE_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --repo "$RELEASE_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Pixelate $RELEASE_TAG"
          fi
